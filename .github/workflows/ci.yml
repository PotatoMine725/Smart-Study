name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SmartStudyPlanner.slnx

      - name: Build
        run: dotnet build SmartStudyPlanner.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test SmartStudyPlanner.Tests/SmartStudyPlanner.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/TestResults

      # WP-2.2 removed the tests that wrote into the developer's real profile; WP-3.2
      # very nearly put them back through two seams nobody had listed. A green suite
      # says nothing about this — the leak was only found by looking at the disk.
      # The runner never launches the app, so any SmartStudyPlanner directory here was
      # created by a test, and that is always a defect.
      - name: Assert tests did not write to the user profile
        shell: pwsh
        run: |
          $leaks = @()
          foreach ($d in @("$env:APPDATA\SmartStudyPlanner", "$env:LOCALAPPDATA\SmartStudyPlanner")) {
            if (Test-Path $d) { $leaks += Get-ChildItem $d -Recurse -Force -File }
          }
          if ($leaks.Count -gt 0) {
            Write-Host "::error::Tests wrote $($leaks.Count) file(s) into the real user profile:"
            $leaks | ForEach-Object { Write-Host "::error::  $($_.FullName)" }
            exit 1
          }
          Write-Host "No profile writes detected."

      # AST-05 / AC-21 — no encoder binary may enter git at any commit of the
      # neural-encoder initiative. The check asserts over `git ls-files`, NOT over
      # the working tree: the point is to catch a *committed* binary, and an
      # untracked local model download is expected and fine. Asserting over the
      # working tree would fire on every developer's local pilot artifacts and
      # would be weakened within a week.
      # Largest tracked file at the time of writing is 0.16 MB, so a 1 MB ceiling
      # has ~6x headroom over anything legitimate in this repo.
      - name: Assert no model binary is tracked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bannedExt = @('.onnx', '.onnx_data', '.safetensors', '.gguf', '.tflite', '.pt', '.pth')
          $maxBytes  = 1MB
          $tracked   = git ls-files
          $offences  = @()
          foreach ($f in $tracked) {
            if ([string]::IsNullOrWhiteSpace($f)) { continue }
            $ext = [System.IO.Path]::GetExtension($f).ToLowerInvariant()
            if ($bannedExt -contains $ext) {
              $offences += "banned extension '$ext': $f"
              continue
            }
            if ((Split-Path $f -Leaf) -eq 'tokenizer.model') {
              $offences += "SentencePiece vocabulary: $f"
              continue
            }
            if (Test-Path -LiteralPath $f) {
              $len = (Get-Item -LiteralPath $f).Length
              if ($len -gt $maxBytes) {
                $offences += ("oversized tracked file ({0:N2} MB > 1 MB): {1}" -f ($len / 1MB), $f)
              }
            }
          }
          if ($offences.Count -gt 0) {
            Write-Host "::error::AST-05 violation - model binaries or oversized files are tracked in git:"
            $offences | ForEach-Object { Write-Host "::error::  $_" }
            exit 1
          }
          Write-Host "No tracked model binaries. $($tracked.Count) tracked files checked."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
